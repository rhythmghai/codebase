# Render Blueprint for the CodeRAG API. Deploys api/main.py via the
# repo's own Dockerfile (git is required at runtime for /ingest, and the
# Dockerfile already installs it correctly -- reusing it avoids
# duplicating that logic in a native buildCommand).
#
# Persistent disk is not optional here: SQLite (chunk metadata, job
# status), the embedded Qdrant vector index, and any live-ingested repo's
# workspace all need to survive restarts/redeploys, or every deploy would
# silently wipe all indexed data. Disks require the "starter" plan or
# above -- Render's free tier does not support them.
#
# IMPORTANT: `branch` below targets the feature branch this Blueprint was
# authored on (PR #1), not `main` -- main does not have this hardened
# code yet. Update this to `main` (or remove the field, main is Render's
# default) once that PR is merged.

services:
  - type: web
    name: coderag-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    branch: hardening-and-vector-db
    healthCheckPath: /health
    disk:
      name: coderag-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: WORKSPACE_ROOT
        value: /app/data/workspaces
      - key: LOG_LEVEL
        value: INFO
      # Required before any public traffic reaches this service -- without
      # it, auth is disabled and this becomes an open proxy for compute
      # and LLM spend (see common/config.py). Fill in via the Dashboard.
      - key: API_KEYS
        sync: false
      # Set to the deployed UI's origin (e.g. https://coderag-ui.vercel.app)
      # once that's known -- unset means CORS stays wide open ("*").
      - key: ALLOWED_ORIGINS
        sync: false
      # Optional: enables real Gemini generation instead of the
      # deterministic RuleBasedLLM fallback.
      - key: GOOGLE_API_KEY
        sync: false
      # Optional: enables Neo4j graph traversal instead of the local JSON
      # fallback. Leave unset to skip Neo4j entirely.
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
